<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessWise - AI Hostel Food Demand & Waste Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">MessWise AI Dashboard</h1>
                <p class="text-sm text-slate-400">AI-Based Hostel Food Demand and Waste Predictor</p>
            </div>
            <span class="px-3 py-1 bg-emerald-900/50 text-emerald-400 border border-emerald-700 text-xs rounded-full">System Online</span>
        </header>

        <!-- Prediction Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Meal Demand Predictor</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Date</label>
                    <input type="date" id="date" value="2026-10-25" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Meal</label>
                    <select id="meal" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="breakfast">Breakfast</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Expected Headcount</label>
                    <input type="number" id="headcount" value="470" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                </div>
            </div>
            <button onclick="getPrediction()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-2 rounded text-sm transition">Generate AI Forecast</button>
        </div>

        <!-- Results Box -->
        <div id="results" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg space-y-4">
            <h3 class="text-md font-semibold text-emerald-400">Prediction Results</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <span class="block text-xs text-slate-400">Predicted Demand</span>
                    <span id="res-pred" class="text-xl font-bold text-white">-</span>
                </div>
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <span class="block text-xs text-slate-400">80% Uncertainty Range</span>
                    <span id="res-range" class="text-xl font-bold text-blue-400">-</span>
                </div>
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <span class="block text-xs text-slate-400">Recommended Prep</span>
                    <span id="res-rec" class="text-xl font-bold text-emerald-400">-</span>
                </div>
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <span class="block text-xs text-slate-400">Risk Level</span>
                    <span id="res-risk" class="text-xl font-bold text-yellow-400">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getPrediction() {
            const date = document.getElementById('date').value;
            const meal = document.getElementById('meal').value;
            const expected_attendance = parseInt(document.getElementById('headcount').value);

            const response = await fetch('http://localhost:8000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, meal, expected_attendance, planned_prep: expected_attendance + 50 })
            });
            const data = await response.json();

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('res-pred').innerText = data.predicted + ' servings';
            document.getElementById('res-range').innerText = `${data.low} - ${data.high}`;
            document.getElementById('res-rec').innerText = data.recommended_prep + ' servings';
            document.getElementById('res-risk').innerText = data.risk.toUpperCase();
        }
    </script>
</body>
</html>
